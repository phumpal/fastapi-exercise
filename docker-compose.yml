x-postgres-env: &postgres-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: fastapi_development

services:
  db:
    image: postgres:17.4
    environment:
      <<: *postgres-env
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *postgres-env
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pg-data:
