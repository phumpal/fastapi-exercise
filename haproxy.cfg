global
    log 127.0.0.1 local0
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull

    log-format json

    retries 3

    timeout connect 5s
    timeout client  10s
    timeout server  20s
    timeout http-request 10s
    timeout http-keep-alive 30s

frontend http_front
    bind *:80
    default_backend app_servers
    stats enable
    stats uri /stats

backend app_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server init-addr last,libc,none

    server app1 app:3000 check inter 3s fall 3 rise 3

    errorfile 503 /usr/local/etc/haproxy/errors/503.http
